{% extends "sas/base.html" %}
{% block content %}
<div class="max-w-sm mx-auto bg-white p-6 shadow">
  <h2 class="text-xl font-bold mb-4">Prijava na sistem</h2>
  <form method="post">
    {% csrf_token %}
    <div class="mb-4">
      <label class="block mb-1">Korisničko ime:</label>
      <input type="text" name="username" required class="w-full border-gray-300 border px-3 py-2"/>
    </div>
    <div class="mb-4">
      <label class="block mb-1">Lozinka:</label>
      <input type="password" name="password" required class="w-full border-gray-300 border px-3 py-2"/>
    </div>
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 hover:bg-blue-700">Prijavi se</button>
  </form>
</div>
{% endblock %}
